# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Por defecto CodeRabbit solo revisa los PR contra la rama principal.
# La migración a Cloudflare va en PR contra `cloudflare`, así que se añade aquí.
language: es-ES
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "cloudflare"
