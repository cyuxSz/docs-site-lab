# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Por defecto CodeRabbit solo revisa los PR contra la rama principal.
# Tras el corte a Cloudflare, `main` es la rama de producción; `cloudflare` queda durante la transición
# y los lotes apilados van contra `factory/*`.
language: es-ES
reviews:
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "cloudflare"
      - "factory/.*"
