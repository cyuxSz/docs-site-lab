[package]
name = "nucleo"
version = "0.1.0"
edition = "2021"
publish = false
description = "Proxy autenticado de la app VantTec Docs. No depende de la ventana, para probarse sin webview."

[dependencies]
base64 = "=0.22.1"
http = "=1.5.0"
ring = "=0.17.14"
serde_json = "=1.0.154"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "gzip"] }
